<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>c0der — zero code needed</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="/js/marked.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <h1>c0der</h1>
        <p class="tagline">zero code needed</p>
        <button class="collapse-btn" id="collapse-sidebar" title="Collapse sidebar">&lsaquo;</button>
      </div>
      <button id="new-session-btn">+ New Session</button>
      <div class="mode-selector">
        <button class="mode-btn active" data-mode="builder" title="Plan, write, and run code for you">🧩 Builder</button>
        <button class="mode-btn" data-mode="mentor" title="Explain every line like a tutor">🎓 Mentor</button>
        <button class="mode-btn" data-mode="reviewer" title="Critique and improve existing code">🧠 Reviewer</button>
      </div>
      <ul id="session-list"></ul>
    </aside>

    <!-- Resize handle: sidebar <-> chat -->
    <div class="resize-handle" id="resize-left"></div>

    <!-- Main area -->
    <main id="main">
      <!-- Chat panel -->
      <section id="chat-panel">
        <div id="messages"></div>
        <form id="chat-form">
          <textarea
            id="chat-input"
            placeholder="Describe what you want to build..."
            rows="3"
          ></textarea>
          <div class="chat-actions">
            <button type="button" id="clear-btn" title="Clear chat history">Clear</button>
            <button type="submit" id="send-btn">Send</button>
          </div>
        </form>
      </section>

      <!-- Resize handle: chat <-> right panel -->
      <div class="resize-handle" id="resize-right"></div>

      <!-- Right panel: files + code viewer -->
      <section id="right-panel">
        <div id="right-panel-header">
          <button class="collapse-btn" id="collapse-right" title="Collapse panel">&rsaquo;</button>
        </div>
        <div id="file-browser">
          <h3>Files</h3>
          <ul id="file-list"></ul>
        </div>
        <div id="code-viewer">
          <div id="code-header">
            <span id="code-filename">Select a file</span>
            <button id="run-btn" disabled title="Run this file">Run</button>
          </div>
          <textarea id="code-editor" placeholder="Select a file to view and edit..." disabled></textarea>
          <div id="run-output" class="hidden">
            <div id="run-output-header">Output</div>
            <pre id="run-output-content"></pre>
          </div>
        </div>
      </section>
    </main>

    <!-- Collapsed sidebar toggle -->
    <button class="expand-btn expand-left hidden" id="expand-sidebar" title="Expand sidebar">&rsaquo;</button>
    <!-- Collapsed right panel toggle -->
    <button class="expand-btn expand-right hidden" id="expand-right" title="Expand panel">&lsaquo;</button>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
